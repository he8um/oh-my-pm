name: Release v0.6 Stable

# Manually gated STABLE release workflow for the v0.6 line. It builds and verifies
# the exact 0.6.2 self-contained "omp-cli-namespace" portable artifact.
#
# v0.6.2 closes the Project Memory integrity gaps found by the audit in
# docs/releases/v0.6.2-integrity-audit.md. It adds ONE command and changes nothing
# else about how an existing store is read or written:
#
#   * `omp memory repair` -- the supported, preview-first recovery path. `repair`
#     scans and proposes while changing no byte; `repair --apply` performs bounded
#     recovery under the single-writer lock, re-scanning under that lock and
#     refusing a plan whose store fingerprint moved;
#   * authoritative bytes are ISOLATED into a governed quarantine with their exact
#     contents preserved -- never rewritten from a guess, never deleted -- and only
#     derived state is rebuilt, from verified records only;
#   * quarantine is recovery evidence: excluded from record discovery and
#     chronology, and never automatically pruned.
#
# Isolation is deliberately NOT reported as repair. A quarantined record's meaning
# is not recovered, so `isolated` and `reconstructed` stay separate counters and
# there is no combined "repaired" total.
#
# The executable surface is unchanged from v0.6.0: `omp`/`omp-mcp`/`omp-install`
# canonical, `ohmypm*` supported compatibility aliases, `oh-my-pm*` deprecated
# aliases, no removal scheduled. Every alias forwards to the same implementation
# and writes exactly one notice to stderr; stdout stays byte-identical to the
# canonical command's, so piped JSON remains parseable and the MCP stdio stream
# remains protocol-clean.
#
# The artifact's runtime surface is otherwise identical to v0.6.1 -- TWELVE
# read-only MCP tools, zero write tools, the bundled @oh-my-pm/project-memory
# package, Project Brain schema 1 and store format 2 unchanged -- so no data
# migration is required. `memory` now has EIGHT subcommands: `repair` is APPENDED
# to the closed allowlist, so every historical subcommand keeps its position.
#
# There is NO other public behavior change: no command removed, no CLI syntax or
# output change outside the additive command, no MCP tool/schema/annotation/order
# change, no failure code renamed or removed, and no exit code changed.
#
# Product identity is deliberately unchanged: the archives remain
# oh-my-pm-v0.6.2.{tar.gz,zip}, the installation directory remains
# lib/oh-my-pm/versions/<version>/, the package scope remains @oh-my-pm/*, the
# environment prefix remains OH_MY_PM_*, and the MCP server key remains
# oh-my-pm.
#
# It runs the cross-platform installed qualification, and — only on an explicitly
# confirmed, environment-approved publish run — creates an immutable,
# non-prerelease GitHub Release marked "latest" targeting the exact workflow
# commit SHA. It publishes to no registry, and it never modifies the immutable
# v0.1.0 / v0.2.0-rc.1 / v0.2.0 / v0.3.0-rc.1 / v0.3.0 / v0.3.1 / v0.4.0 / v0.5.1 /
# v0.5.2 / v0.5.3 / v0.5.4 releases or the historical workflows.
#
# Manually triggered only. There is no push, pull_request, release, schedule, or
# tag trigger. The prepare and qualification jobs cannot write repository
# contents; only the gated publish job receives contents: write, and only when
# publish == true with the exact confirmation and the protected github-release
# environment approval.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical version without v prefix
        required: true
        default: "0.6.2"
        type: string
      publish:
        # publish=false is the DRY RUN: prepare, deterministic assets, and the
        # cross-platform installed qualification all run; the publish job is
        # skipped, so no tag and no release are created and releases/latest is
        # untouched.
        description: Create the Git tag and stable GitHub Release after validation
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RELEASE v0.6.2 when publish is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: oh-my-pm-release-v0.6-stable-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare stable release assets
    runs-on: ubuntu-latest
    # Observed max 7.8 min. This job runs the full build, the complete test
    # suite, every validator, and deterministic archive construction.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Enforce main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release v0.6 Stable must run from refs/heads/main (got $GITHUB_REF)" >&2
            exit 1
          fi

      - name: Enforce version and confirmation gates
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$INPUT_VERSION" != "0.6.2" ]; then
            echo "Only version 0.6.2 is accepted by this workflow (got $INPUT_VERSION)" >&2
            exit 1
          fi
          if [ "$INPUT_PUBLISH" = "true" ] && [ "$INPUT_CONFIRMATION" != "RELEASE v0.6.2" ]; then
            echo "publish requires confirmation exactly equal to: RELEASE v0.6.2" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce version.json equals the input version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          FILE_VERSION="$(node -p "require('./version.json').version")"
          if [ "$FILE_VERSION" != "$INPUT_VERSION" ]; then
            echo "version.json ($FILE_VERSION) does not equal input version ($INPUT_VERSION)" >&2
            exit 1
          fi

      - name: Verify base stable lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_TAG=v0.6.1
          BASE_SHA=b5a43d1230d8af116f12848ba7cdfe6006a353ec
          # The base stable tag must still exist on origin.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Required base stable tag $BASE_TAG does not exist on origin" >&2
            exit 1
          fi
          # It must resolve to the exact published stable commit.
          BASE_RESOLVED="$(git ls-remote --tags origin "refs/tags/$BASE_TAG" | awk '{print $1}')"
          if [ "$BASE_RESOLVED" != "$BASE_SHA" ]; then
            echo "Base stable tag $BASE_TAG resolves to $BASE_RESOLVED, expected $BASE_SHA" >&2
            exit 1
          fi
          # The base stable release must remain a non-draft, non-prerelease.
          BASE_META="$(gh release view "$BASE_TAG" --json isPrerelease,isDraft)"
          echo "$BASE_META"
          echo "$BASE_META" | node -e '
            const meta = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (meta.isPrerelease !== false) { console.error("base stable must remain non-prerelease"); process.exit(1); }
            if (meta.isDraft !== false) { console.error("base stable must remain non-draft"); process.exit(1); }
          '
          # The v0.6.2 release notes must exist.
          test -f docs/releases/v0.6.2.md

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-08
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build kernel
        run: pnpm build:kernel

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate
        run: pnpm validate

      # v0.6 gates: the command names in every manifest, installer, release
      # metadata, and generated configuration must agree with
      # command-surface.json, and no active documentation or help surface may
      # present a deprecated alias as the primary command.
      - name: Validate command surface
        run: pnpm validate:commands

      - name: Validate command references
        run: pnpm validate:references

      - name: Version consistency
        run: pnpm version:check

      - name: MCP smoke
        run: pnpm mcp:smoke

      - name: Build and verify portable bundle (omp-cli-namespace profile)
        run: |
          VERSION="${{ inputs.version }}"
          BUNDLE_OUT="$RUNNER_TEMP/bundle"

          node tools/build-release-bundle.mjs --output "$BUNDLE_OUT" --apply
          node tools/check-release-bundle.mjs --bundle "$BUNDLE_OUT/oh-my-pm-v$VERSION"

          # The stable bundle must declare the twelve-tool
          # omp-cli-namespace profile, keep schema 1 / store format 2 with no
          # migration, expose zero write tools, persist no timeline, and ship the
          # bundled Project Memory package.
          node -e '
            const fs = require("node:fs");
            const dir = process.argv[1];
            const r = JSON.parse(fs.readFileSync(dir + "/RELEASE.json", "utf8"));
            if (r.releaseLine !== "v0.6") { console.error("releaseLine must be v0.6"); process.exit(1); }
            if (r.bundleProfile !== "omp-cli-namespace") { console.error("bundleProfile must be omp-cli-namespace"); process.exit(1); }
            if (r.expectedMcpToolCount !== 12) { console.error("expectedMcpToolCount must be 12"); process.exit(1); }
            if (r.mcpTools.length !== 12) { console.error("mcpTools must list 12 tools"); process.exit(1); }
            if (r.mcpTools[r.mcpTools.length - 1] !== "project_timeline") { console.error("project_timeline must be last"); process.exit(1); }
            if (r.mcpTools[r.mcpTools.length - 2] !== "project_changes") { console.error("project_changes must be eleventh"); process.exit(1); }
            const pb = r.projectBrain || {};
            if (pb.schemaVersion !== 1) { console.error("Project Brain schema must remain 1"); process.exit(1); }
            if (pb.storeFormatVersion !== 2) { console.error("store format must remain 2"); process.exit(1); }
            if (pb.storeMigrationRequired !== false) { console.error("no store migration may be required"); process.exit(1); }
            if (pb.mcpWriteTools !== 0) { console.error("MCP write tools must be 0"); process.exit(1); }
            if (pb.timelinePersistence !== false) { console.error("no timeline may be persisted"); process.exit(1); }
            if (pb.automaticMigration !== false) { console.error("no automatic migration"); process.exit(1); }
            if (pb.projectWrites !== false) { console.error("no project writes"); process.exit(1); }
            if ((pb.memorySubcommands || []).length !== 7) { console.error("memorySubcommands must be 7"); process.exit(1); }
            if (r.transport !== "stdio") { console.error("transport must be stdio"); process.exit(1); }
            if (!fs.existsSync(dir + "/node_modules/@oh-my-pm/project-memory/dist/index.js")) { console.error("project-memory must be bundled"); process.exit(1); }

            // v0.6 command surface: canonical commands and BOTH alias classes are
            // declared as distinct fields, never one flat list. Collapsing the two
            // alias classes would misreport `ohmypm*` -- canonical in v0.5 -- as
            // deprecated.
            const cc = r.canonicalCommands || {};
            if (cc.cli !== "omp") { console.error("canonicalCommands.cli must be omp"); process.exit(1); }
            if (cc.mcp !== "omp-mcp") { console.error("canonicalCommands.mcp must be omp-mcp"); process.exit(1); }
            if (cc.installer !== "omp-install") { console.error("canonicalCommands.installer must be omp-install"); process.exit(1); }
            const ca = r.compatibilityAliases || {};
            if (JSON.stringify(ca.cli) !== JSON.stringify(["ohmypm"])) { console.error("compatibilityAliases.cli must be [ohmypm]"); process.exit(1); }
            if (JSON.stringify(ca.mcp) !== JSON.stringify(["ohmypm-mcp"])) { console.error("compatibilityAliases.mcp must be [ohmypm-mcp]"); process.exit(1); }
            if (JSON.stringify(ca.installer) !== JSON.stringify(["ohmypm-install"])) { console.error("compatibilityAliases.installer must be [ohmypm-install]"); process.exit(1); }
            const da = r.deprecatedAliases || {};
            if (JSON.stringify(da.cli) !== JSON.stringify(["oh-my-pm"])) { console.error("deprecatedAliases.cli must be [oh-my-pm]"); process.exit(1); }
            if (JSON.stringify(da.mcp) !== JSON.stringify(["oh-my-pm-mcp"])) { console.error("deprecatedAliases.mcp must be [oh-my-pm-mcp]"); process.exit(1); }
            if (JSON.stringify(da.installer) !== JSON.stringify(["oh-my-pm-install"])) { console.error("deprecatedAliases.installer must be [oh-my-pm-install]"); process.exit(1); }
            const la = r.legacyAliases || {};
            if (JSON.stringify(la.cli) !== JSON.stringify(["ohmypm", "oh-my-pm"])) { console.error("legacyAliases.cli must list both alias classes"); process.exit(1); }
            if (JSON.stringify(r.commands) !== JSON.stringify(["omp", "omp-mcp"])) { console.error("commands must be the canonical installed pair"); process.exit(1); }
            if (r.commandRemovalScheduled !== false) { console.error("no alias removal may be scheduled"); process.exit(1); }
            if (r.commandsCanonicalSince !== "0.6.0") { console.error("commandsCanonicalSince must be 0.6.0"); process.exit(1); }
            if (r.installer.entrypoint !== "bin/omp-install.mjs") { console.error("installer entrypoint must be bin/omp-install.mjs"); process.exit(1); }

            // The bundle must ship all THREE command families as real entrypoints.
            for (const bin of ["omp.mjs", "omp-mcp.mjs", "omp-install.mjs", "ohmypm.mjs", "ohmypm-mcp.mjs", "ohmypm-install.mjs", "oh-my-pm.mjs", "oh-my-pm-mcp.mjs", "oh-my-pm-install.mjs"]) {
              if (!fs.existsSync(dir + "/bin/" + bin)) { console.error("missing bundled entrypoint: " + bin); process.exit(1); }
            }

            // Product identity must NOT be renamed by this migration.
            if (r.bundle !== "oh-my-pm-v" + r.version) { console.error("bundle name must stay product-based"); process.exit(1); }
            if (r.name !== "OH MY PM") { console.error("product name must stay OH MY PM"); process.exit(1); }
          ' "$BUNDLE_OUT/oh-my-pm-v$VERSION"

      - name: Build and verify deterministic archives
        run: |
          VERSION="${{ inputs.version }}"
          BUNDLE_DIR="$RUNNER_TEMP/bundle/oh-my-pm-v$VERSION"
          ASSETS_DIR="$RUNNER_TEMP/release-assets"

          node tools/build-release-archives.mjs --bundle "$BUNDLE_DIR" --output "$ASSETS_DIR" --apply
          node tools/check-release-archives.mjs --assets "$ASSETS_DIR"
          node tools/check-release-archive-reproducibility.mjs --bundle "$BUNDLE_DIR"

      - name: Print archive checksums to summary
        run: |
          VERSION="${{ inputs.version }}"
          {
            echo "### OH MY PM v$VERSION release archive checksums"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/release-assets/oh-my-pm-v$VERSION-SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oh-my-pm-v0.6.2-release-assets
          path: |
            ${{ runner.temp }}/release-assets/oh-my-pm-v0.6.2.tar.gz
            ${{ runner.temp }}/release-assets/oh-my-pm-v0.6.2.zip
            ${{ runner.temp }}/release-assets/oh-my-pm-v0.6.2-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  installed-qualification:
    name: Installed command-surface qualification (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Observed max 1.6 min; qualifies an already-prepared artifact.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          # The matrix jobs run only Node against the prepared artifact; no
          # package manager is installed, so disable the package-manager cache.
          package-manager-cache: false

      - name: Download prepared release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oh-my-pm-v0.6.2-release-assets
          path: release-assets

      - name: Verify checksum then qualify the installed artifact (POSIX)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ inputs.version }}"
          cd release-assets
          shasum -a 256 -c "oh-my-pm-v$VERSION-SHA256SUMS.txt"
          cd ..
          node tools/check-v0.3-installed-project-brain.mjs \
            --archive "release-assets/oh-my-pm-v$VERSION.tar.gz" \
            --work "$RUNNER_TEMP/qual-work" \
            --profile omp-cli-namespace

      # v0.6: install the artifact into a scratch prefix and exercise ALL THREE
      # command families explicitly. The canonical commands must be silent on
      # stderr; each alias must still work, must emit exactly one notice on
      # stderr with its own class wording, and must keep that notice out of
      # stdout so piped JSON stays parseable.
      - name: Canonical and alias installed smoke (POSIX)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ inputs.version }}"
          WORK="$RUNNER_TEMP/alias-smoke"
          mkdir -p "$WORK"
          tar -xzf "release-assets/oh-my-pm-v$VERSION.tar.gz" -C "$WORK"
          BUNDLE="$WORK/oh-my-pm-v$VERSION"
          PREFIX="$WORK/prefix"
          node "$BUNDLE/bin/omp-install.mjs" --prefix "$PREFIX" --apply

          # All twelve shims must exist: two canonical commands, two compatibility
          # aliases, and two deprecated aliases, each with a POSIX and a .cmd
          # launcher.
          SHIM_COUNT=0
          for name in omp omp-mcp ohmypm ohmypm-mcp oh-my-pm oh-my-pm-mcp; do
            test -f "$PREFIX/bin/$name" || { echo "missing shim: $name" >&2; exit 1; }
            test -x "$PREFIX/bin/$name" || { echo "shim not executable: $name" >&2; exit 1; }
            test -f "$PREFIX/bin/$name.cmd" || { echo "missing .cmd shim: $name" >&2; exit 1; }
            SHIM_COUNT=$((SHIM_COUNT + 2))
          done
          if [ "$SHIM_COUNT" -ne 12 ]; then
            echo "expected 12 shims, counted $SHIM_COUNT" >&2
            exit 1
          fi

          # Canonical: clean stdout, empty stderr.
          "$PREFIX/bin/omp" status > "$WORK/canonical.out" 2> "$WORK/canonical.err"
          grep -q "OH MY PM status: healthy" "$WORK/canonical.out"
          test ! -s "$WORK/canonical.err" || { echo "canonical command wrote to stderr" >&2; exit 1; }

          # Every alias: identical stdout, exactly one notice on stderr only, with
          # the wording that matches its class.
          check_alias() {
            ALIAS="$1"
            PHRASE="$2"
            "$PREFIX/bin/$ALIAS" status > "$WORK/$ALIAS.out" 2> "$WORK/$ALIAS.err"
            diff "$WORK/canonical.out" "$WORK/$ALIAS.out"
            grep -q "$PHRASE" "$WORK/$ALIAS.err" || { echo "$ALIAS: missing '$PHRASE' on stderr" >&2; exit 1; }
            grep -q "omp" "$WORK/$ALIAS.err" || { echo "$ALIAS: warning does not name omp" >&2; exit 1; }
            if grep -q "Warning:" "$WORK/$ALIAS.out"; then
              echo "$ALIAS wrote its notice to stdout" >&2
              exit 1
            fi
            COUNT="$(grep -c "Warning:" "$WORK/$ALIAS.err" || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "$ALIAS emitted $COUNT warnings, expected exactly 1" >&2
              exit 1
            fi
            # JSON through the alias must remain a parseable document on stdout.
            "$PREFIX/bin/$ALIAS" status --json > "$WORK/$ALIAS.json" 2>/dev/null
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$WORK/$ALIAS.json"
          }
          check_alias ohmypm "is a compatibility alias"
          check_alias oh-my-pm "is deprecated"

          # A compatibility alias must never call itself deprecated.
          if grep -q "deprecated" "$WORK/ohmypm.err"; then
            echo "compatibility alias reported itself as deprecated" >&2
            exit 1
          fi

          # The installed manifest must separate canonical from alias commands.
          node -e '
            const m = require(process.argv[1]);
            if (JSON.stringify(Object.keys(m.commands)) !== JSON.stringify(["omp", "omp-mcp"])) { console.error("commands must be canonical"); process.exit(1); }
            if (JSON.stringify(Object.keys(m.legacyCommands)) !== JSON.stringify(["ohmypm", "ohmypm-mcp", "oh-my-pm", "oh-my-pm-mcp"])) { console.error("legacyCommands must be both alias classes"); process.exit(1); }
          ' "$PREFIX/lib/oh-my-pm/install.json"

          # The MCP stdio stream must stay protocol-clean through every alias:
          # a single stray byte on stdout would desynchronize JSON-RPC.
          for mcp in omp-mcp ohmypm-mcp oh-my-pm-mcp; do
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
              | "$PREFIX/bin/$mcp" > "$WORK/$mcp.stdout" 2> "$WORK/$mcp.stderr" || true
            node -e '
              const fs = require("node:fs");
              const name = process.argv[1];
              const out = fs.readFileSync(process.argv[2], "utf8").trim();
              if (out === "") { console.error(name + ": no protocol output"); process.exit(1); }
              for (const line of out.split("\n")) {
                if (line.trim() === "") continue;
                let msg;
                try { msg = JSON.parse(line); } catch { console.error(name + ": non-JSON on stdout: " + line.slice(0, 120)); process.exit(1); }
                if (msg.jsonrpc !== "2.0") { console.error(name + ": stdout line is not JSON-RPC 2.0"); process.exit(1); }
              }
            ' "$mcp" "$WORK/$mcp.stdout"
          done

      - name: Verify checksum then qualify the installed artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          Push-Location release-assets
          $sums = Get-Content "oh-my-pm-v$version-SHA256SUMS.txt"
          foreach ($line in $sums) {
            if ($line.Trim() -eq "") { continue }
            $parts = $line -split "\s+", 2
            $expected = $parts[0]
            $file = $parts[1].Trim()
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            if ($actual -ne $expected) { throw "checksum mismatch for $file" }
          }
          Pop-Location
          node tools/check-v0.3-installed-project-brain.mjs `
            --archive "release-assets/oh-my-pm-v$version.zip" `
            --work "$env:RUNNER_TEMP/qual-work" `
            --profile omp-cli-namespace
          if ($LASTEXITCODE -ne 0) { throw "installed qualification failed" }

  publish:
    name: Publish stable GitHub Release
    needs: [prepare, installed-qualification]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    # timeout-minutes bounds EXECUTION only; it starts when the job begins
    # running, which for an environment-protected job is after the reviewer
    # approves. Waiting for that approval is therefore not on this clock and
    # cannot be cut short by it. Observed execution: 0.3 min (create the
    # release, verify tag/assets/latest, re-download and re-verify checksums).
    # 20 min leaves ample room for a slow asset upload without leaving a job
    # holding contents: write open indefinitely.
    timeout-minutes: 20
    environment:
      name: github-release
    # Least privilege, scoped to the one job that publishes:
    #
    #   contents: write      -- create the tag and the GitHub Release;
    #   id-token: write      -- mint the short-lived OIDC token actions/attest
    #                           exchanges for a Sigstore signing certificate.
    #                           Without it the action fails closed with
    #                           'missing "id-token" permission';
    #   attestations: write  -- upload the signed attestation bundle to this
    #                           repository's attestation store.
    #
    # artifact-metadata: write is deliberately NOT granted. In actions/attest
    # v4.2.2 the storage-record call is reachable only inside
    # `if (subjects.length === 1 && opts.pushToRegistry)` (src/attest.ts), and
    # this step attests THREE file subjects with push-to-registry left at its
    # default of false. The branch cannot be entered, so the permission would be
    # standing authority this workflow never exercises.
    #
    # No other job in this workflow, and no other workflow in this repository,
    # receives id-token: write or attestations: write. The signing identity is
    # GitHub's short-lived OIDC path: no secret, no PAT, no stored signing key.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Re-enforce version and confirmation gates
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$INPUT_VERSION" != "0.6.2" ]; then
            echo "Only version 0.6.2 is accepted by this workflow (got $INPUT_VERSION)" >&2
            exit 1
          fi
          if [ "$INPUT_CONFIRMATION" != "RELEASE v0.6.2" ]; then
            echo "publish requires confirmation exactly equal to: RELEASE v0.6.2" >&2
            exit 1
          fi

      - name: Enforce version.json equals the input version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          FILE_VERSION="$(node -p "require('./version.json').version")"
          if [ "$FILE_VERSION" != "$INPUT_VERSION" ]; then
            echo "version.json ($FILE_VERSION) does not equal input version ($INPUT_VERSION)" >&2
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oh-my-pm-v0.6.2-release-assets
          path: release-assets

      - name: Re-verify archive checksums
        run: |
          cd release-assets
          sha256sum -c oh-my-pm-v0.6.2-SHA256SUMS.txt

      - name: Ensure release notes exist
        run: test -f docs/releases/v0.6.2.md

      - name: Ensure tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.6.2
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; refusing to overwrite" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi

      - name: Ensure the base stable release still exists and is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_TAG=v0.6.1
          BASE_SHA=b5a43d1230d8af116f12848ba7cdfe6006a353ec
          if ! git ls-remote --exit-code --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "Base stable tag $BASE_TAG no longer exists; refusing to publish v0.6.2" >&2
            exit 1
          fi
          BASE_RESOLVED="$(git ls-remote --tags origin "refs/tags/$BASE_TAG" | awk '{print $1}')"
          if [ "$BASE_RESOLVED" != "$BASE_SHA" ]; then
            echo "Base stable tag $BASE_TAG changed (resolves to $BASE_RESOLVED, expected $BASE_SHA)" >&2
            exit 1
          fi
          BASE_META="$(gh release view "$BASE_TAG" --json isPrerelease,isDraft)"
          echo "$BASE_META" | node -e '
            const meta = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (meta.isPrerelease !== false) { console.error("base stable must remain non-prerelease"); process.exit(1); }
            if (meta.isDraft !== false) { console.error("base stable must remain non-draft"); process.exit(1); }
          '

      # Build provenance (audit finding F-02). Binds each published artifact's
      # SHA-256 digest to the workflow identity that produced it, signed with a
      # short-lived Sigstore certificate obtained through GitHub's OIDC path.
      #
      # Placement is deliberate. This step runs AFTER the assets are downloaded,
      # their checksums re-verified, the release notes confirmed present, the
      # duplicate tag/release check passed, and the base stable lineage
      # re-verified -- so provenance is only ever generated over bytes that have
      # already been proven to be the qualified artifact. It runs BEFORE the
      # release is created, so a failure here fails the job closed and nothing
      # is published. A release carrying no attestation is a release that was
      # never created, not one published and patched afterwards.
      #
      # actions/attest (not actions/attest-build-provenance): as of v4 the
      # latter is a thin wrapper over this action, and upstream directs new
      # implementations here. With no sbom-path/predicate inputs supplied, the
      # action's default mode auto-generates SLSA build provenance.
      #
      # The three subjects are listed explicitly rather than by glob: the
      # attested set must be exactly the three assets the release-creation step
      # below uploads, and a wildcard would silently widen it if the assets
      # directory ever gained a file.
      - name: Attest build provenance for the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/oh-my-pm-v0.6.2.tar.gz
            release-assets/oh-my-pm-v0.6.2.zip
            release-assets/oh-my-pm-v0.6.2-SHA256SUMS.txt

      - name: Create stable GitHub Release at the exact workflow commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.6.2" \
            "release-assets/oh-my-pm-v0.6.2.tar.gz" \
            "release-assets/oh-my-pm-v0.6.2.zip" \
            "release-assets/oh-my-pm-v0.6.2-SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "OH MY PM v0.6.2" \
            --notes-file "docs/releases/v0.6.2.md" \
            --latest

      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          META="$(gh release view v0.6.2 --json tagName,isDraft,isPrerelease,assets)"
          echo "$META"
          echo "$META" | node -e '
            const meta = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const expected = [
              "oh-my-pm-v0.6.2-SHA256SUMS.txt",
              "oh-my-pm-v0.6.2.tar.gz",
              "oh-my-pm-v0.6.2.zip",
            ].sort();
            const names = (meta.assets || []).map((a) => a.name).sort();
            if (meta.tagName !== "v0.6.2") { console.error("bad tag"); process.exit(1); }
            if (meta.isDraft !== false) { console.error("draft must be false"); process.exit(1); }
            if (meta.isPrerelease !== false) { console.error("prerelease must be false"); process.exit(1); }
            if (JSON.stringify(names) !== JSON.stringify(expected)) { console.error("asset mismatch"); process.exit(1); }
          '

      - name: Verify latest release resolves to the stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)"
          echo "latest release: $LATEST"
          if [ "$LATEST" != "v0.6.2" ]; then
            echo "releases/latest is $LATEST, expected v0.6.2" >&2
            exit 1
          fi

      - name: Revalidate published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DL="$RUNNER_TEMP/published"
          mkdir -p "$DL"
          gh release download v0.6.2 --dir "$DL"
          cd "$DL"
          sha256sum -c oh-my-pm-v0.6.2-SHA256SUMS.txt

      - name: Print release URL to summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$(gh release view v0.6.2 --json url --jq .url)"
          echo "Published stable release: $URL" >> "$GITHUB_STEP_SUMMARY"
