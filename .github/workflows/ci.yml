name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository. It publishes nothing, comments
# nowhere, and needs no token scope beyond checkout. Declared explicitly rather
# than inherited from repository defaults.
permissions:
  contents: read

# Supersede in-flight validation of the SAME pull request when a new commit is
# pushed to it. `cancel-in-progress` is deliberately an expression rather than a
# literal `true`:
#
#   - pull_request runs group by PR number and MAY be cancelled, because a newer
#     commit on that PR has already made the older run's result irrelevant;
#   - push runs on main group by ref and are NEVER cancelled, because a main run
#     is the evidence a release qualifies against. A merge landing while an
#     earlier main run is still going must not silently void that run.
#
# Release and publication workflows set their own non-cancelable concurrency and
# are unaffected by this group; nothing here can cancel a release job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Observed 6.5-8.4 min across the last 10 runs; 25 min is roughly 3x the
    # worst case, leaving room for a cold Rust/wasm-bindgen build without
    # letting a hung job burn a full six-hour default.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-08
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # --frozen-lockfile makes CI installation reproducible: it fails rather
      # than silently resolving a new dependency graph when pnpm-lock.yaml does
      # not match package.json. Without it, a lockfile that was never committed
      # would still produce a green run here and a different tree at release
      # time. This is the same flag the release workflow already uses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build kernel
        run: pnpm build:kernel

      - name: Build
        run: pnpm build

      # Static quality runs after the build (type-aware lint rules need the
      # generated contracts to exist) and before the tests, so a policy
      # violation is reported as itself rather than as a test failure.
      - name: Lint
        run: pnpm lint

      - name: Formatting check
        run: pnpm format:check

      # Split into attributable steps so a future failure names the subsystem
      # instead of surfacing as one opaque "Test" failure. Unit tests keep full
      # file parallelism; the release suites run serialized so they cannot race
      # over the shared workspace build output while computing bundle checksums.
      - name: Unit tests
        run: pnpm test:unit

      - name: Release integration tests
        run: pnpm test:release

      - name: Rust tests
        run: pnpm test:rust

      # The Rust gates the release notes recorded as deferred: the generated
      # contracts are emitted rustfmt-canonical and the hand-written sources
      # were normalized, so the baseline is clean and these can fail the build.
      - name: Rust formatting
        run: pnpm rust:fmt:check

      - name: Clippy
        run: pnpm rust:clippy

      - name: Validate
        run: pnpm validate

      # pnpm validate already runs both of these. They are re-run as named steps
      # so a documentation-truth or architecture-boundary regression is
      # attributable on its own in the checks list, instead of being reported as
      # a generic "Validate" failure.
      - name: Validate documentation truth
        run: pnpm validate:docs

      - name: Validate architecture boundaries
        run: pnpm validate:boundaries

      # v0.6.3 (audit finding F-03): every third-party action runs with
      # repository credentials, so a reference that resolves through a mutable
      # tag or branch is code that can change after review. Attributable on its
      # own because a reintroduced floating ref is a supply-chain regression,
      # not a generic validation failure.
      - name: Validate GitHub Action pins
        run: pnpm validate:action-pins

      # v0.6.3: the release workflow's build-provenance boundary. The signing
      # permissions must stay scoped to the single publish job, the attested
      # subjects must stay exactly the three published assets, and attestation
      # must stay ordered after checksum verification and before publication.
      # Attributable on its own because a widened subject glob or a hoisted
      # id-token permission is a supply-chain regression, not a generic
      # validation failure. This checks structure only: no attestation is
      # generated here, and CI holds no signing permission.
      - name: Validate release provenance boundary
        run: pnpm validate:provenance

      # v0.6.1: ownership of the shared workflows, in both directions. The four
      # shared project workflows must reach the application boundary from every
      # surface, AND status/doctor/plan must stay outside it. Attributable on its
      # own because over-migration and drift are distinct regressions.
      - name: Validate application boundary ownership
        run: pnpm validate:application

      # v0.5.4: the package catalog drives the dependency-direction, cycle,
      # internal-import, and process-side-effect checks. Re-run as a named step
      # so a boundary regression is attributable on its own in the checks list.
      - name: Validate package catalog
        run: pnpm validate:packages

      # v0.5.1: the dependency direction is the point of the application
      # boundary, so it is asserted directly in CI and not only in unit tests.
      - name: Application boundary parity
        run: |
          # The MCP server must not depend on the CLI, in the manifest or in
          # any source or bin file.
          node -e '
            const pkg = require("./mcp-server/package.json");
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              if (pkg[field] && Object.hasOwn(pkg[field], "@oh-my-pm/cli")) {
                console.error(`mcp-server/package.json ${field} still contains @oh-my-pm/cli`);
                process.exit(1);
              }
            }
            if (!pkg.dependencies?.["@oh-my-pm/application"]) {
              console.error("mcp-server must depend on @oh-my-pm/application");
              process.exit(1);
            }
          '
          if grep -rn '"@oh-my-pm/cli"' mcp-server/src mcp-server/bin; then
            echo "mcp-server still imports @oh-my-pm/cli" >&2
            exit 1
          fi
          # The application layer must depend on no presentation package.
          if grep -rn '"@oh-my-pm/\(cli\|mcp-server\|installer\|distribution\)"' application/src; then
            echo "application imports a presentation/installer/distribution package" >&2
            exit 1
          fi
          # The application layer owns no process boundary and no server. The
          # authoritative check is in validate-boundaries (section 10), which
          # strips comments first -- the package's own documentation names the
          # very APIs it forbids, so a plain grep would false-positive here.
          # v0.5.1 implements no Dashboard.
          for dir in dashboard web ui frontend desktop; do
            if [ -d "$dir" ]; then
              echo "unexpected presentation package: $dir/" >&2
              exit 1
            fi
          done

      - name: Application package tests
        run: pnpm --filter @oh-my-pm/application test

      - name: MCP smoke
        run: pnpm mcp:smoke

      # The twelve-tool surface and its exact order are a client-facing
      # contract. mcp:smoke asserts them from a live server; this step also
      # proves the CLI renders identically after the application refactor.
      - name: CLI behavior parity
        run: |
          FIXTURE=examples/fixtures/markdown-project
          # Deterministic: the same command twice must be byte-identical.
          node cli/bin/omp.mjs brief "$FIXTURE" --json > "$RUNNER_TEMP/brief-1.json"
          node cli/bin/omp.mjs brief "$FIXTURE" --json > "$RUNNER_TEMP/brief-2.json"
          diff "$RUNNER_TEMP/brief-1.json" "$RUNNER_TEMP/brief-2.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/brief-1.json"
          # Every read-only workflow exits 0 and writes nothing to stderr.
          for cmd in status doctor; do
            node cli/bin/omp.mjs "$cmd" > /dev/null 2> "$RUNNER_TEMP/$cmd.err"
            test ! -s "$RUNNER_TEMP/$cmd.err"
          done
          for cmd in brief risks next handoff; do
            node cli/bin/omp.mjs "$cmd" "$FIXTURE" > /dev/null 2> "$RUNNER_TEMP/$cmd.err"
            test ! -s "$RUNNER_TEMP/$cmd.err"
          done
          node cli/bin/omp.mjs providers status > /dev/null 2> "$RUNNER_TEMP/providers.err"
          test ! -s "$RUNNER_TEMP/providers.err"
          # The memory namespace still resolves all seven subcommands.
          node cli/bin/omp.mjs memory --help > "$RUNNER_TEMP/memory-help.txt"
          for sub in capture changes status history export delete timeline; do
            grep -q "$sub" "$RUNNER_TEMP/memory-help.txt" || {
              echo "memory help lost the $sub subcommand" >&2
              exit 1
            }
          done
          # A missing root fails closed with exit 2 and a sanitized message.
          if node cli/bin/omp.mjs brief ./definitely-not-a-real-root > /dev/null 2> "$RUNNER_TEMP/missing.err"; then
            echo "a missing project root must fail" >&2
            exit 1
          fi
          grep -q "project root was not found" "$RUNNER_TEMP/missing.err"
          test -z "$(git status --porcelain)"

      - name: Local install smoke (canonical commands)
        run: |
          PREFIX="$RUNNER_TEMP/oh-my-pm-local"
          node tools/install-local.mjs --prefix "$PREFIX"
          test ! -e "$PREFIX/bin/omp"
          node tools/install-local.mjs --prefix "$PREFIX" --apply
          node tools/check-local-install.mjs --prefix "$PREFIX"
          # Canonical commands: clean stdout, nothing on stderr.
          "$PREFIX/bin/omp" status > "$RUNNER_TEMP/canonical.out" 2> "$RUNNER_TEMP/canonical.err"
          grep -q "OH MY PM status: healthy" "$RUNNER_TEMP/canonical.out"
          test ! -s "$RUNNER_TEMP/canonical.err"
          "$PREFIX/bin/omp" --help | grep -q "omp <command>"
          # Generated MCP configuration must invoke the canonical MCP command.
          node tools/print-mcp-client-config.mjs --prefix "$PREFIX" > "$RUNNER_TEMP/omp-mcp.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/omp-mcp.json"
          grep -q "bin/omp-mcp" "$RUNNER_TEMP/omp-mcp.json"
          # The server KEY stays the product name; only the command migrated.
          grep -q '"oh-my-pm"' "$RUNNER_TEMP/omp-mcp.json"

      # Both alias classes are tested separately and explicitly, so a regression
      # in any family is attributable on its own.
      - name: Local install smoke (compatibility and deprecated aliases)
        run: |
          PREFIX="$RUNNER_TEMP/oh-my-pm-local"
          # Every alias shim exists, in both POSIX and .cmd form.
          for name in ohmypm ohmypm-mcp oh-my-pm oh-my-pm-mcp; do
            test -f "$PREFIX/bin/$name"
            test -x "$PREFIX/bin/$name"
            test -f "$PREFIX/bin/$name.cmd"
          done
          # Each alias works, emits exactly one stderr notice carrying its own
          # class wording, and keeps stdout byte-identical to the canonical
          # command's. The two classes differ deliberately: `ohmypm` was canonical
          # in v0.5 and must NOT be reported as deprecated.
          check_alias() {
            ALIAS="$1"
            PHRASE="$2"
            "$PREFIX/bin/$ALIAS" status > "$RUNNER_TEMP/$ALIAS.out" 2> "$RUNNER_TEMP/$ALIAS.err"
            diff "$RUNNER_TEMP/canonical.out" "$RUNNER_TEMP/$ALIAS.out"
            grep -q "$PHRASE" "$RUNNER_TEMP/$ALIAS.err"
            grep -q "omp" "$RUNNER_TEMP/$ALIAS.err"
            if grep -q "Warning:" "$RUNNER_TEMP/$ALIAS.out"; then
              echo "$ALIAS wrote its notice to stdout" >&2
              exit 1
            fi
            COUNT="$(grep -c "Warning:" "$RUNNER_TEMP/$ALIAS.err" || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "$ALIAS emitted $COUNT warnings, expected exactly 1" >&2
              exit 1
            fi
            # Help through the alias still teaches the canonical command.
            "$PREFIX/bin/$ALIAS" --help 2>/dev/null | grep -q "omp <command>"
            # JSON through the alias stays a complete, parseable document.
            "$PREFIX/bin/$ALIAS" status --json > "$RUNNER_TEMP/$ALIAS.json" 2>/dev/null
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/$ALIAS.json"
          }
          check_alias ohmypm "is a compatibility alias"
          check_alias oh-my-pm "is deprecated"
          # A compatibility alias must never call itself deprecated.
          if grep -q "deprecated" "$RUNNER_TEMP/ohmypm.err"; then
            echo "compatibility alias reported itself as deprecated" >&2
            exit 1
          fi

      - name: Portable release bundle smoke
        run: |
          VERSION="$(node -p "require('./version.json').version")"
          BUNDLE_NAME="oh-my-pm-v$VERSION"
          OUT="$RUNNER_TEMP/oh-my-pm-release"
          MOVED="$RUNNER_TEMP/oh-my-pm-release-moved"
          node tools/build-release-bundle.mjs --output "$OUT"
          test ! -e "$OUT/$BUNDLE_NAME"
          node tools/build-release-bundle.mjs --output "$OUT" --apply
          mkdir -p "$MOVED"
          mv "$OUT/$BUNDLE_NAME" "$MOVED/$BUNDLE_NAME"
          node tools/check-release-bundle.mjs --bundle "$MOVED/$BUNDLE_NAME"

      - name: Release archives smoke
        run: |
          VERSION="$(node -p "require('./version.json').version")"
          BUNDLE_NAME="oh-my-pm-v$VERSION"
          BUNDLE_OUT="$RUNNER_TEMP/oh-my-pm-archive-bundle"
          ASSETS="$RUNNER_TEMP/oh-my-pm-archive-assets"
          node tools/build-release-bundle.mjs --output "$BUNDLE_OUT" --apply
          BUNDLE="$BUNDLE_OUT/$BUNDLE_NAME"
          node tools/build-release-archives.mjs --bundle "$BUNDLE" --output "$ASSETS"
          test ! -e "$ASSETS/$BUNDLE_NAME.tar.gz"
          node tools/build-release-archives.mjs --bundle "$BUNDLE" --output "$ASSETS" --apply
          node tools/check-release-archives.mjs --assets "$ASSETS"
          node tools/check-release-archive-reproducibility.mjs --bundle "$BUNDLE"
          test -z "$(git status --porcelain)"

      - name: Release install smoke
        run: |
          VERSION="$(node -p "require('./version.json').version")"
          BUNDLE_NAME="oh-my-pm-v$VERSION"
          BUILD_OUT="$RUNNER_TEMP/oh-my-pm-install-build"
          BUNDLE_HOME="$RUNNER_TEMP/oh-my-pm-install-bundle"
          PREFIX="$RUNNER_TEMP/oh-my-pm-install-prefix"
          MOVED_PREFIX="$RUNNER_TEMP/oh-my-pm-install-prefix-moved"
          # Build and verify a current bundle, then move it outside the checkout.
          node tools/build-release-bundle.mjs --output "$BUILD_OUT" --apply
          node tools/check-release-bundle.mjs --bundle "$BUILD_OUT/$BUNDLE_NAME"
          mkdir -p "$BUNDLE_HOME"
          mv "$BUILD_OUT/$BUNDLE_NAME" "$BUNDLE_HOME/$BUNDLE_NAME"
          BUNDLE="$BUNDLE_HOME/$BUNDLE_NAME"
          # Preview must create no prefix.
          node "$BUNDLE/bin/omp-install.mjs" --prefix "$PREFIX"
          test ! -e "$PREFIX"
          # Apply, verify installed state.
          node "$BUNDLE/bin/omp-install.mjs" --prefix "$PREFIX" --apply
          node tools/check-release-install.mjs --prefix "$PREFIX" --expected-version "$VERSION"
          # All twelve shims: canonical commands, compatibility aliases, and
          # deprecated aliases.
          for name in omp omp-mcp ohmypm ohmypm-mcp oh-my-pm oh-my-pm-mcp; do
            test -f "$PREFIX/bin/$name"
            test -f "$PREFIX/bin/$name.cmd"
          done
          # Both installer aliases forward and warn on stderr only, each with its
          # own class wording.
          node "$BUNDLE/bin/ohmypm-install.mjs" 2> "$RUNNER_TEMP/inst-compat.err" || true
          grep -q "is a compatibility alias" "$RUNNER_TEMP/inst-compat.err"
          grep -q "omp-install" "$RUNNER_TEMP/inst-compat.err"
          node "$BUNDLE/bin/oh-my-pm-install.mjs" 2> "$RUNNER_TEMP/inst-alias.err" || true
          grep -q "is deprecated" "$RUNNER_TEMP/inst-alias.err"
          grep -q "omp-install" "$RUNNER_TEMP/inst-alias.err"
          # Remove the source bundle by its exact RUNNER_TEMP child path;
          # installed CLI must still work. (Never delete $RUNNER_TEMP itself or
          # an inferred parent.)
          rm -rf "$BUNDLE_HOME"
          "$PREFIX/bin/omp" status
          "$PREFIX/bin/ohmypm" status > /dev/null 2>&1
          "$PREFIX/bin/oh-my-pm" status > /dev/null 2>&1
          # Move the whole prefix to another exact RUNNER_TEMP child; relative
          # shims must still work. $RUNNER_TEMP already exists, so no parent is
          # created or inferred.
          mv "$PREFIX" "$MOVED_PREFIX"
          "$MOVED_PREFIX/bin/omp" status
          "$MOVED_PREFIX/bin/ohmypm" status > /dev/null 2>&1
          "$MOVED_PREFIX/bin/oh-my-pm" status > /dev/null 2>&1
          node tools/check-release-install.mjs --prefix "$MOVED_PREFIX" --expected-version "$VERSION"
          test -z "$(git status --porcelain)"

  windows-release-install:
    name: Windows release install smoke
    runs-on: windows-latest
    # Observed max 6.5 min. Windows runners are the slowest and most variable
    # of the three platforms, so this carries more headroom than the Linux job.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable resolved 2026-08-08
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      # Reproducible installation, matching the Linux validate job: the Windows
      # tree must be resolved from the same committed lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build kernel
        run: pnpm build:kernel

      - name: Build
        run: pnpm build

      - name: Release install smoke via .cmd shims
        shell: pwsh
        run: |
          function Assert-RunnerTempChild([string]$Path) {
            $runner = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $target = [System.IO.Path]::GetFullPath($Path)
            if (-not $target.StartsWith($runner + [System.IO.Path]::DirectorySeparatorChar)) {
              throw "unsafe temporary path: $target"
            }
          }
          $version = node -p "require('./version.json').version"
          $bundleName = "oh-my-pm-v$version"
          $buildOut = Join-Path $env:RUNNER_TEMP "omp-install-build"
          $prefix = Join-Path $env:RUNNER_TEMP "omp-install-prefix"
          $movedPrefix = Join-Path $env:RUNNER_TEMP "omp-install-prefix-moved"
          # Every generated/deleted/moved path must be an exact descendant of
          # RUNNER_TEMP.
          Assert-RunnerTempChild $buildOut
          Assert-RunnerTempChild $prefix
          Assert-RunnerTempChild $movedPrefix
          # The relocation target must not pre-exist.
          if (Test-Path -LiteralPath $movedPrefix) { throw "moved prefix already exists" }
          # Native (node) failures do not stop pwsh mid-script, so every step's
          # exit code is checked explicitly to surface a failure at its source.
          node tools/build-release-bundle.mjs --output $buildOut --apply
          if ($LASTEXITCODE -ne 0) { throw "bundle build failed" }
          $bundle = Join-Path $buildOut $bundleName
          node tools/check-release-bundle.mjs --bundle $bundle
          if ($LASTEXITCODE -ne 0) { throw "bundle verification failed" }
          # The complete generated Kernel binding must be present (this is the
          # exact set that Windows pnpm deploy previously omitted).
          $generated = Join-Path $bundle "node_modules/@oh-my-pm/kernel/generated-node"
          foreach ($asset in @("oh_my_pm_kernel.js", "oh_my_pm_kernel_bg.wasm", "package.json")) {
            $assetPath = Join-Path $generated $asset
            if (-not (Test-Path $assetPath)) { throw "missing generated kernel asset: $assetPath" }
          }
          # The bundled CLI must load the real Kernel and report status.
          node (Join-Path $bundle "bin/omp.mjs") status
          if ($LASTEXITCODE -ne 0) { throw "bundled CLI status failed" }
          $installer = Join-Path $bundle "bin/omp-install.mjs"
          if (-not (Test-Path $installer)) { throw "missing bundled installer: $installer" }
          # Preview must create no prefix.
          node $installer --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "installer preview failed" }
          if (Test-Path $prefix) { throw "preview created a prefix" }
          # Apply and verify the twelve shims, including the .cmd shims, exist.
          # Capture stderr so a failure surfaces the installer's bounded,
          # path-free reason codes (e.g. post_install_verification_failed,
          # post_posix_shim_mode_mismatch) that pinpoint the failing subsystem.
          $applyErr = Join-Path $env:RUNNER_TEMP "omp-install-apply.err"
          node $installer --prefix $prefix --apply 2> $applyErr
          $applyExit = $LASTEXITCODE
          if (Test-Path $applyErr) { Get-Content $applyErr | Write-Host }
          if ($applyExit -ne 0) { throw "installer apply failed" }
          # v0.6 installs twelve shims on Windows too: the canonical commands,
          # the compatibility aliases, and the deprecated aliases, each with a
          # .cmd launcher.
          foreach ($shim in @(
            "omp", "omp.cmd", "omp-mcp", "omp-mcp.cmd",
            "ohmypm", "ohmypm.cmd", "ohmypm-mcp", "ohmypm-mcp.cmd",
            "oh-my-pm", "oh-my-pm.cmd", "oh-my-pm-mcp", "oh-my-pm-mcp.cmd"
          )) {
            $path = Join-Path $prefix (Join-Path "bin" $shim)
            if (-not (Test-Path $path)) { throw "missing shim: $path" }
          }
          # Canonical installed CLI status through the .cmd shim.
          $canonicalOut = Join-Path $env:RUNNER_TEMP "omp-canonical.out"
          & (Join-Path $prefix "bin/omp.cmd") status > $canonicalOut
          if ($LASTEXITCODE -ne 0) { throw "installed CLI .cmd status failed" }
          if (-not (Select-String -Path $canonicalOut -Pattern "OH MY PM status: healthy" -Quiet)) {
            throw "canonical .cmd status was not healthy"
          }
          # Every .cmd alias must work, emit exactly one stderr notice with its own
          # class wording, and produce byte-identical stdout. This is the Windows
          # counterpart of the POSIX alias check.
          foreach ($pair in @(
            @{ Alias = "ohmypm"; Phrase = "is a compatibility alias" },
            @{ Alias = "oh-my-pm"; Phrase = "is deprecated" }
          )) {
            $a = $pair.Alias
            $aliasOut = Join-Path $env:RUNNER_TEMP "$a-alias.out"
            $aliasErr = Join-Path $env:RUNNER_TEMP "$a-alias.err"
            & (Join-Path $prefix "bin/$a.cmd") status > $aliasOut 2> $aliasErr
            if ($LASTEXITCODE -ne 0) { throw "$a .cmd alias failed" }
            if ((Get-Content -Raw $aliasOut) -ne (Get-Content -Raw $canonicalOut)) {
              throw "$a .cmd alias stdout differs from canonical"
            }
            if (-not (Select-String -Path $aliasErr -Pattern $pair.Phrase -Quiet)) {
              throw "$a .cmd alias did not warn on stderr with its class wording"
            }
            if (Select-String -Path $aliasOut -Pattern "Warning:" -Quiet) {
              throw "$a .cmd alias wrote its notice to stdout"
            }
            $warnCount = (Select-String -Path $aliasErr -Pattern "Warning:" -AllMatches).Matches.Count
            if ($warnCount -ne 1) { throw "$a .cmd alias emitted $warnCount warnings, expected 1" }
            # JSON through the alias must stay parseable.
            $aliasJson = Join-Path $env:RUNNER_TEMP "$a-alias.json"
            & (Join-Path $prefix "bin/$a.cmd") status --json > $aliasJson 2> $null
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' $aliasJson
            if ($LASTEXITCODE -ne 0) { throw "$a .cmd alias produced invalid JSON on stdout" }
          }
          # A compatibility alias must never call itself deprecated.
          if (Select-String -Path (Join-Path $env:RUNNER_TEMP "ohmypm-alias.err") -Pattern "deprecated" -Quiet) {
            throw "compatibility .cmd alias reported itself as deprecated"
          }
          # Installed MCP entrypoints available (resolve without launching). The
          # lib/oh-my-pm product directory is deliberately unchanged by v0.6.
          foreach ($entry in @("omp-mcp.mjs", "ohmypm-mcp.mjs", "oh-my-pm-mcp.mjs")) {
            $mcpTarget = Join-Path $prefix (Join-Path "lib" (Join-Path "oh-my-pm" (Join-Path "versions" (Join-Path $version (Join-Path "bin" $entry)))))
            if (-not (Test-Path $mcpTarget)) { throw "installed MCP entrypoint missing: $mcpTarget" }
          }
          # Full read-only installed-state verification.
          node tools/check-release-install.mjs --prefix $prefix --expected-version $version
          if ($LASTEXITCODE -ne 0) { throw "installed-state verification failed" }
          # Source-bundle independence: remove ONLY the exact bundle-build
          # directory (validated as a RUNNER_TEMP child), then prove the installed
          # CLI and the full installed-state checker (CLI workflows + MCP) still
          # work. This catches any dependency on the extracted bundle, junctions
          # back to it, or assets that were not copied into the version directory.
          Assert-RunnerTempChild $buildOut
          Remove-Item -LiteralPath $buildOut -Recurse -Force
          if (Test-Path -LiteralPath $buildOut) { throw "source bundle removal failed" }
          & (Join-Path $prefix "bin/omp.cmd") status
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed after source bundle removal" }
          node tools/check-release-install.mjs --prefix $prefix --expected-version $version
          if ($LASTEXITCODE -ne 0) { throw "installed-state verification failed after source bundle removal" }
          # Prefix relocation: move the complete installed prefix to another exact
          # RUNNER_TEMP child, then prove the relocated .cmd shim and the full
          # installed-state checker (CLI workflows + MCP) still work. This catches
          # hard-coded absolute prefix paths, non-relocatable shims, absolute
          # Windows junctions, and manifests/imports tied to the original location.
          if (Test-Path -LiteralPath $movedPrefix) { throw "moved prefix already exists" }
          Move-Item -LiteralPath $prefix -Destination $movedPrefix
          if (Test-Path -LiteralPath $prefix) { throw "original prefix still exists after relocation" }
          if (-not (Test-Path -LiteralPath $movedPrefix)) { throw "relocated prefix is missing" }
          & (Join-Path $movedPrefix "bin/omp.cmd") status
          if ($LASTEXITCODE -ne 0) { throw "relocated installed CLI .cmd status failed" }
          foreach ($a in @("ohmypm", "oh-my-pm")) {
            & (Join-Path $movedPrefix "bin/$a.cmd") status > $null 2> $null
            if ($LASTEXITCODE -ne 0) { throw "relocated $a .cmd alias failed" }
          }
          node tools/check-release-install.mjs --prefix $movedPrefix --expected-version $version
          if ($LASTEXITCODE -ne 0) { throw "relocated installed-state verification failed" }

  project-memory-integrity:
    name: Project Memory integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The integrity suites spawn real child processes and create real temporary
    # store trees, but build no Rust or wasm, so they are far cheaper than the
    # validate job. Observed under 3 min on every platform.
    timeout-minutes: 20

    strategy:
      # Every platform must report independently. A Windows-only path-semantics
      # or process-termination defect must fail visibly rather than be masked by
      # a green Linux job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm

      # No Rust, no kernel, no workspace build: these suites exercise the
      # project-memory package against the real filesystem and real OS
      # processes, and the suite itself builds the package's dist/ before
      # spawning any worker.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Project Memory integrity suites (real processes, real filesystem)
        run: pnpm test:integrity

      - name: Working tree must be clean
        shell: bash
        run: |
          # The integrity suites must leave no generated file behind. dist/ is
          # git-ignored, so a dirty tree here means a test wrote into the repo.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "integrity suites left the working tree dirty" >&2
            exit 1
          fi
