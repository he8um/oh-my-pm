[package]
name = "oh-my-pm-kernel"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Pure deterministic Kernel for OH MY PM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
# Pure-Rust, WASM-compatible SHA-256 for deterministic fingerprints.
sha2 = "0.10"
# Pure-Rust RFC3339 / date parsing only. No clock feature: default-features are
# disabled so no system-clock, no OS time source, no randomness is linked in.
time = { version = "0.3", default-features = false, features = ["parsing"] }
